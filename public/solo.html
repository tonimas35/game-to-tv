<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Juegos del Salón · solo con el móvil</title>
<style>
  /* «Solo con el móvil»: the phone is the screen AND the controller.
     Back layer: the TV page (it shows the game). Front layer: the phone page
     (the controls), see-through while a game is on, solid in the menus. */
  html, body { margin: 0; height: 100%; background: #070915; overflow: hidden; overscroll-behavior: none; }
  iframe { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
  #tele { z-index: 1; pointer-events: none; }
  #mando { z-index: 2; background: transparent; }
  body.menu #tele { visibility: hidden; }
</style>
</head>
<body class="menu">
<iframe id="tele" title="Pantalla" src="/"></iframe>
<iframe id="mando" title="Mando" src="/m" allowtransparency="true"></iframe>
<script>
(function () {
  var tele = document.getElementById('tele');
  var mando = document.getElementById('mando');
  var CSS = 'html,body,#app{background:transparent!important}' +
    'body.g2t-solo-juego #app>*:not(#modal):not(#banner):not(#toast){background-color:transparent!important}';
  function inject() {
    try {
      var d = mando.contentDocument;
      if (!d || d.getElementById('g2t-solo')) return;
      var s = d.createElement('style');
      s.id = 'g2t-solo';
      s.textContent = CSS;
      d.head.appendChild(s);
    } catch (e) { /* noop */ }
  }
  mando.addEventListener('load', inject);
  // Menu or game? The phone page shows its game list only in the menu
  setInterval(function () {
    inject();
    var inMenu = true;
    try {
      var d = mando.contentDocument;
      var list = d && d.getElementById('gameList');
      inMenu = !!(list && list.offsetParent !== null);
      if (d && d.body) d.body.classList.toggle('g2t-solo-juego', !inMenu);
    } catch (e) { /* noop */ }
    document.body.classList.toggle('menu', inMenu);
    mando.style.opacity = inMenu ? '1' : '0.4';   // in a game: see the arena through the controls
  }, 300);
})();
</script>
</body>
</html>
