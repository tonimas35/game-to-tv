org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true

# Signing key for sideloading with `adb install -r` (every build must be signed
# with the SAME key, or Android refuses the update). It is committed on purpose:
# solo para instalar a mano por ADB; no es una clave de tienda.
g2tStoreFile=sideload.keystore
g2tStorePassword=juegos-del-salon-sideload
g2tKeyAlias=sideload
g2tKeyPassword=juegos-del-salon-sideload
