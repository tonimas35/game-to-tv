# «Juegos del Salón» for Android TV / Google TV / Fire TV (apps/android-tv/).
#
#  apk       the APKs (armeabi-v7a, arm64-v8a and universal), signed with the
#            sideload key committed in apps/android-tv/ so that `adb install -r`
#            accepts every new build. Artifact: juegos-del-salon-android
#  emulador  the same app built for x86_64 on an Android 12 emulator with the
#            «Android TV (1080p)» profile: Node starts, /info answers, the TV
#            page scales to the screen and the remote keys work (D-pad, OK, Back)
name: Android TV

on:
  push:
    paths:
      - 'apps/android-tv/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/android-bundle.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODEJS_MOBILE_VERSION: v18.20.4

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: nodejs-mobile (libnode para Android)
        uses: actions/cache@v4
        with:
          path: apps/android-tv/app/libnode
          key: nodejs-mobile-${{ env.NODEJS_MOBILE_VERSION }}
      - run: bash apps/android-tv/get-libnode.sh

      - name: Versión (package.json)
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compilar (pruebas de Java + APKs)
        working-directory: apps/android-tv
        run: bash ci/run.sh "Gradle" gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease

      - name: APKs con nombre y versión
        env:
          G2T_NOTICE: '1'
          G2T_NOTICE_LINES: '40'
        run: bash apps/android-tv/ci/run.sh "APKs" bash apps/android-tv/ci/package-apks.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-del-salon-android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: nodejs-mobile (libnode para Android)
        uses: actions/cache@v4
        with:
          path: apps/android-tv/app/libnode
          key: nodejs-mobile-${{ env.NODEJS_MOBILE_VERSION }}
      - run: bash apps/android-tv/get-libnode.sh

      - name: Compilar para x86_64 (emulador)
        working-directory: apps/android-tv
        run: bash ci/run.sh "Gradle x86_64" gradle --no-daemon -Pg2tAbis=x86_64 :app:assembleRelease

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en un emulador Android 12 con perfil de tele (1080p)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: G2T_NOTICE=1 G2T_NOTICE_LINES=70 bash apps/android-tv/ci/run.sh "Emulador" bash apps/android-tv/ci/emulator-test.sh apps/android-tv/app/build/outputs/apk/release/app-x86_64-release.apk emulador

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-capturas
          path: emulador/
          if-no-files-found: ignore
          retention-days: 14
