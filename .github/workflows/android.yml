# «Juegos del Salón» for Android TV / Google TV / Fire TV (apps/android-tv/).
#
#  pruebas   npm test + npm run check (nothing is published without them)
#  apk       the APKs (armeabi-v7a, arm64-v8a and universal), signed with the
#            sideload key committed in apps/android-tv/ so that `adb install -r`
#            accepts every new build. Artifact: juegos-del-salon-android
#  emulador  the same app built for x86_64 on an Android 12 emulator with the
#            «Android TV (1080p)» profile: Node starts, /info answers, the TV
#            page scales to the screen and the remote keys work (D-pad, OK, Back);
#            then the automatic game updates against a fake server (ota-check.js)
#  publicar  main only, when all of the above pass: the APKs and the game
#            bundle (bundle.zip + bundle.json, what the installed apps download
#            by themselves) go to the «apk» branch
name: Android TV

on:
  push:
    paths:
      - 'apps/android-tv/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/android-bundle.js'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODEJS_MOBILE_VERSION: v18.20.4

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: nodejs-mobile (libnode para Android)
        uses: actions/cache@v4
        with:
          path: apps/android-tv/app/libnode
          key: nodejs-mobile-${{ env.NODEJS_MOBILE_VERSION }}
      - run: bash apps/android-tv/get-libnode.sh

      - name: Versión (package.json)
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compilar (pruebas de Java + APKs)
        working-directory: apps/android-tv
        run: bash ci/run.sh "Gradle" gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:assembleRelease

      - name: APKs con nombre y versión
        env:
          G2T_NOTICE: '1'
          G2T_NOTICE_LINES: '40'
        run: bash apps/android-tv/ci/run.sh "APKs" bash apps/android-tv/ci/package-apks.sh "${{ steps.v.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-del-salon-android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      # The game bundle for the automatic updates: exactly the nodejs-project
      # folder that went into these APKs (assets), zipped
      - name: Paquete de juegos (bundle.zip + bundle.json)
        run: |
          node scripts/android-bundle.js --ota dist/ota --from apps/android-tv/app/build/generated/g2t/assets/nodejs-project
          cat dist/ota/bundle.json

      - uses: actions/upload-artifact@v4
        with:
          name: juegos-del-salon-bundle
          path: dist/ota/
          if-no-files-found: error
          retention-days: 90

  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: nodejs-mobile (libnode para Android)
        uses: actions/cache@v4
        with:
          path: apps/android-tv/app/libnode
          key: nodejs-mobile-${{ env.NODEJS_MOBILE_VERSION }}
      - run: bash apps/android-tv/get-libnode.sh

      - name: Compilar para x86_64 (emulador)
        working-directory: apps/android-tv
        run: bash ci/run.sh "Gradle x86_64" gradle --no-daemon -Pg2tAbis=x86_64 :app:assembleRelease

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en un emulador Android 12 con perfil de tele (1080p)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: G2T_NOTICE=1 G2T_NOTICE_LINES=60 bash apps/android-tv/ci/run.sh "Emulador" bash apps/android-tv/ci/emulator-test.sh apps/android-tv/app/build/outputs/apk/release/app-x86_64-release.apk emulador

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-capturas
          path: emulador/
          if-no-files-found: ignore
          retention-days: 14

  # Public, stable download links (no login), only from main and only if the
  # tests, the APK build and the emulator all passed: a broken commit never
  # reaches the TVs. The «apk» branch gets:
  #   tv.apk (armeabi-v7a: Android TV, Google TV and Fire TV, 32 and 64 bits),
  #   tv-arm64.apk, tv-universal.apk: https://github.com/<repo>/raw/apk/tv.apk
  #   bundle.zip + bundle.json: the game bundle that installed apps download by
  #   themselves (Updater.java reads raw.githubusercontent.com/<repo>/apk/bundle.json)
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: [pruebas, apk, emulador]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: juegos-del-salon-android
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: juegos-del-salon-bundle
          path: dist/ota
      - name: Publicar en la rama «apk»
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          BUNDLE="$(node -p "require('./dist/ota/bundle.json').version")"
          mkdir pub && cd pub
          cp ../dist/*-armeabi-v7a.apk tv.apk
          cp ../dist/*-arm64-v8a.apk tv-arm64.apk
          cp ../dist/*-universal.apk tv-universal.apk
          cp ../dist/ota/bundle.zip ../dist/ota/bundle.json .
          sha256sum *.apk bundle.zip > SHA256SUMS.txt
          printf '# Juegos del Salón para Android TV / Fire TV\n\nVersión %s (juegos %s). Descarga directa: `tv.apk` (vale para casi todas las teles y Fire TV).\nLa app instalada se actualiza sola los juegos con `bundle.json` + `bundle.zip`.\nGuía: docs/tele-android.md en la rama main.\n' "$VERSION" "$BUNDLE" > README.md
          cat bundle.json
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "APK $VERSION, juegos $BUNDLE ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
